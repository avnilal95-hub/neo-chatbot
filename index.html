
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#100b1d">
    <title>NEO AI Chat</title>
    <meta name="description" content="Meet NEO, your personal AI assistant.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app">

        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">

            <div class="brand">
                <div class="brand-icon">N</div>
                <div class="brand-name">
                    <h2>NEO</h2>
                    <span>ARTIFICIAL INTELLIGENCE</span>
                </div>
            </div>

            <button class="new-chat" id="newChat">
                <span>＋</span> New chat
            </button>

            <div class="sidebar-heading">YOUR CONVERSATIONS</div>

            <div class="chat-history" id="chatHistory">
                <!-- Chat history will appear here -->
            </div>

            <div class="sidebar-footer">
                <div class="model-info">
                    <span class="online-dot"></span>
                    <div>
                        <strong>NEO Llama 3.2</strong>
                        <small>Local AI engine</small>
                    </div>
                </div>

                <button class="settings-button" id="settingsButton">
                    ⚙ Settings
                </button>
            </div>

        </aside>

        <!-- Main application -->
        <main class="main">

            <header class="topbar">
                <button class="menu-button" id="menuButton" aria-label="Open menu">
                    ☰
                </button>

                <div class="topbar-title">
                    <span class="status-indicator"></span>
                    NEO AI
                </div>

                <div class="connection-status" id="connectionStatus">
                    Connecting...
                </div>
            </header>

            <!-- Conversation area -->
            <section class="conversation" id="conversation">

                <!-- Welcome screen -->
                <div class="welcome-screen" id="welcomeScreen">

                    <div class="neo-logo">
                        <span>N</span>
                    </div>

                    <div class="welcome-label">YOUR PERSONAL AI ASSISTANT</div>

                    <h1>
                        Hello, I'm <span>NEO.</span>
                    </h1>

                    <p class="welcome-description">
                        Intelligence at your fingertips.
                        What would you like to explore today?
                    </p>

                    <div class="suggestions">

                        <button class="suggestion-card" data-prompt="Explain artificial intelligence in simple words.">
                            <span class="suggestion-icon">✦</span>
                            <div>
                                <strong>Learn something</strong>
                                <small>Explore new topics</small>
                            </div>
                        </button>

                        <button class="suggestion-card" data-prompt="Give me some creative coding project ideas.">
                            <span class="suggestion-icon">⌘</span>
                            <div>
                                <strong>Build something</strong>
                                <small>Explore creative projects</small>
                            </div>
                        </button>

                        <button class="suggestion-card" data-prompt="Help me write a Python program.">
                            <span class="suggestion-icon">⌁</span>
                            <div>
                                <strong>Write code</strong>
                                <small>Create something useful</small>
                            </div>
                        </button>

                        <button class="suggestion-card" data-prompt="Tell me an interesting technology fact.">
                            <span class="suggestion-icon">✧</span>
                            <div>
                                <strong>Discover ideas</strong>
                                <small>Find something interesting</small>
                            </div>
                        </button>

                    </div>
                </div>

                <!-- Messages will appear here -->
                <div class="messages" id="messages"></div>

            </section>

            <!-- Message composer -->
            <footer class="composer-area">

                <form class="composer" id="chatForm">

                    <textarea
                        id="messageInput"
                        rows="1"
                        placeholder="Message NEO..."
                        aria-label="Message NEO"
                    ></textarea>

                    <button type="submit" class="send-button" id="sendButton" aria-label="Send message">
                        ↑
                    </button>

                </form>

                <div class="composer-footer">
                    <span>NEO AI can make mistakes. Verify important information.</span>
                </div>

            </footer>

        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
